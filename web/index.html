<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>capicons — icon search</title>
<meta name="description" content="Instant search across the capicons icon collection (Lawnicons + Simple Icons + custom).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 4a6 6 0 1 1-6 6 6 6 0 0 1 6-6Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="logo"></span>
    <h1>capicons</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="searchwrap">
    <svg class="searchicon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
    <input id="q" type="search" placeholder="Search icons, packages, components…   ( / )" autocomplete="off" spellcheck="false" autofocus>
    <span class="stats" id="stats"></span>
  </div>
  <div class="actions">
    <button id="theme" class="btn ghost" title="Toggle dark mode">◐</button>
  </div>
</header>

<nav class="filters" id="filters">
  <div class="chipgroup" data-kind="source">
    <span class="grouplabel">Source</span>
    <button class="chip on" data-v="lawnicons">Lawnicons</button>
    <button class="chip on" data-v="simpleicons">Simple&nbsp;Icons</button>
    <button class="chip on" data-v="capicons">Capicons</button>
  </div>
</nav>

<main id="viewport" tabindex="-1">
  <div id="spacer"></div>
  <div id="cells"></div>
  <div id="empty" hidden>No icons match. Loosen a filter or clear the search.</div>
</main>

<aside id="drawer" class="drawer" hidden>
  <button class="btn ghost closex" id="closedrawer" title="Close (Esc)">✕</button>
  <div id="drawerbody"></div>
</aside>
<div id="scrim" hidden></div>

<footer class="foot">
  <span id="geninfo"></span>
  · jsDelivr CDN source · icons © their respective authors (see <a href="https://github.com/OWNER/REPO/blob/main/THIRD_PARTY_NOTICES.md">THIRD_PARTY_NOTICES.md</a>)
</footer>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
