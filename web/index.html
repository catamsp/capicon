<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>capicons — icon search</title>
<meta name="description" content="Instant search across the capicons icon collection (Lawnicons + Simple Icons + custom).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 4a6 6 0 1 1-6 6 6 6 0 0 1 6-6Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="logo"></span>
    <h1>capicons</h1>
    <span class="count" id="count">&nbsp;</span>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Search icons, packages, components…   ( / )" autocomplete="off" spellcheck="false" autofocus>
    <span class="stats" id="stats"></span>
  </div>
  <div class="actions">
    <button id="theme" class="btn ghost" title="Toggle dark mode">◐</button>
    <button id="triage" class="btn ghost" title="Select icons and copy denylist/allowlist JSON">Triage</button>
  </div>
</header>

<nav class="filters" id="filters">
  <div class="chipgroup" data-kind="source">
    <span class="grouplabel">Source</span>
    <button class="chip on" data-v="lawnicons">Lawnicons</button>
    <button class="chip on" data-v="simpleicons">Simple&nbsp;Icons</button>
    <button class="chip on" data-v="capicons">Capicons</button>
  </div>
  <div class="chipgroup" data-kind="tier">
    <span class="grouplabel">License</span>
    <button class="chip on t0" data-v="0">✓ Keep</button>
    <button class="chip on t1" data-v="1">▲ Review</button>
    <button class="chip on t2" data-v="2">✕ Block</button>
  </div>
</nav>

<main id="viewport" tabindex="-1">
  <div id="spacer"></div>
  <div id="cells"></div>
  <div id="empty" hidden>No icons match. Loosen a filter or clear the search.</div>
</main>

<div id="triagebar" class="triagebar" hidden>
  <span id="selcount">0 selected</span>
  <button class="btn" id="copydeny">Copy DENYLIST.json fragment</button>
  <button class="btn" id="copyallow">Copy allowlist fragment</button>
  <button class="btn ghost" id="selallvisible">Select all shown</button>
  <button class="btn ghost" id="clearsel">Clear</button>
</div>

<aside id="drawer" class="drawer" hidden>
  <button class="btn ghost closex" id="closedrawer" title="Close (Esc)">✕</button>
  <div id="drawerbody"></div>
</aside>
<div id="scrim" hidden></div>

<footer class="foot">
  <span id="geninfo"></span>
  · jsDelivr CDN source · icons © their respective authors (see <a href="https://github.com/OWNER/REPO/blob/main/THIRD_PARTY_NOTICES.md">THIRD_PARTY_NOTICES.md</a>)
</footer>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
